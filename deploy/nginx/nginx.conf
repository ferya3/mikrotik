# TLS termination + routing. Put your certificate in deploy/nginx/certs/{fullchain.pem,privkey.pem}
# (self-signed for a lab:  openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout deploy/nginx/certs/privkey.pem -out deploy/nginx/certs/fullchain.pem -subj "/CN=nms.local")

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  # ${HTTPS_PORT} is filled in by the nginx image's envsubst template step.
  return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  server_tokens off;
  client_max_body_size 2m;

  # Resolve upstreams per request through Docker's DNS. With a literal host in proxy_pass nginx
  # resolves it once at start-up and refuses to start when a container is missing (e.g. grafana
  # without the monitoring profile, or api still restarting). Now that case is a 502, not a crash loop.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $nms_api http://api:4000;
  set $nms_web http://web:3000;
  set $nms_grafana http://grafana:3000;

  # Prometheus scrapes the API on the internal network; never expose metrics publicly.
  location = /api/metrics { return 404; }

  location /api/ {
    proxy_pass $nms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients cannot spoof their address for the IP allowlist / audit log.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location /grafana/ {
    proxy_pass $nms_grafana;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass $nms_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
